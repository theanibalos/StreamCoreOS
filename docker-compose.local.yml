services:
  nginx:
    build: ../StreamCoreOS-Front
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    volumes:
      - ./database.db:/app/database.db
    command: sh -c "touch /app/database.db && uv run main.py"
    restart: unless-stopped

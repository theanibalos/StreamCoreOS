upstream backend { server backend:8000; }

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ── SSE endpoints — sin buffering ───────────────────────────────
    location ~ ^/api/(chat/stream|dashboard/alerts|system/events|system/events/stream|system/logs/stream|system/traces/stream|overlays/stats|tts/overlay/stream) {
        proxy_pass         http://backend;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_set_header   Connection '';
        chunked_transfer_encoding on;
    }

    # ── Backend API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Frontend SPA — todos los demás paths ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    volumes:
      - ./database.db:/app/database.db
    command: sh -c "touch /app/database.db && uv run main.py"
    restart: unless-stopped

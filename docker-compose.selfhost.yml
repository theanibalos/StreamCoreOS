services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: data/database.db
      # Overrides the static FRONTEND_URL/TWITCH_REDIRECT_URI from .env so both
      # follow APP_PORT automatically — change APP_PORT in .env, nothing else.
      FRONTEND_URL: http://localhost:${APP_PORT:-80}
      TWITCH_REDIRECT_URI: http://localhost:${APP_PORT:-80}/api/auth/twitch/callback
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    command: sh -c "uv run main.py"
    restart: unless-stopped

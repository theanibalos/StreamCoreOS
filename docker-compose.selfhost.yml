services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: data/database.db
      # Public URL used by browser OAuth redirects.
      # Set APP_ORIGIN=http://streammachine (or http://streammachine:PORT) in .env
      # when accessing the app from another machine instead of localhost.
      FRONTEND_URL: ${APP_ORIGIN:-http://localhost:${APP_PORT:-80}}
      TWITCH_REDIRECT_URI: ${APP_ORIGIN:-http://localhost:${APP_PORT:-80}}/api/auth/twitch/callback
    ports:
      - "1935:1935"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./media:/app/media
    command: sh -c "uv run main.py"
    restart: unless-stopped

[project]
name = "streamcoreos"
version = "0.1.0"
description = "StreamCoreOS built on MicroCoreOS"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "microcoreos[all]>=0.4.4",
    "httpx>=0.27.0",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "protobuf>=5.29.0",
    "edge-tts>=7.2.8",
    "pyrtmp>=0.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "anyio[trio]>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.15.16",
    "watchfiles>=1.1.1",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "_core_disabled",
    "tools/youtube/_generated",
]

[tool.ruff.lint]
ignore = ["E701"]
select = ["E4", "E7", "E9", "F"]


